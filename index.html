<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/img/favicon.svg" sizes="any" type="image/svg+xml">
    <title>3D Cube UI</title>
    <script>
        // only show spinner on first load
        if (localStorage.getItem('ui-has-loaded')) { document.documentElement.classList.add('loader-seen'); }
    </script>
    <!-- Bootstrap 5.3.8 and Bootstrap Icons 1.13.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
     <!-- SwiperJS 12 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <!-- Mobile-only Swiper UI styles (loaded only on small screens) -->
    <link rel="stylesheet" href="assets/css/mobile-ui.css" media="(max-width: 749px), (max-height: 420px)">
    <!-- Local Stylesheets -->
    <link rel="stylesheet" type="text/css" href="assets/css/loader.css" />
    <link rel="stylesheet" type="text/css" href="assets/css/styles.css" />
    <link rel="stylesheet" type="text/css" href="assets/css/cube.css" />    
</head>
<body>

    <!-- spinner (loading cube animation) -->
    <div id="spinner-overlay">
        <div class="wrapper">
            <div class="loading">Loading...</div>
            <div class="loader-cube" alt="Spinning cube animation">
                <div class="loader-face front"></div>
                <div class="loader-face back"></div>
                <div class="loader-face left"></div>
                <div class="loader-face right"></div>
                <div class="loader-face top"></div>
                <div class="loader-face bottom"></div>
            </div>
        </div>
    </div>

    <!-- notifications -->
    <div id="notify-container" class="notify-container" aria-live="polite" aria-atomic="true">
        <!-- Template banner (cloned by JS for each notification) -->
        <div class="notify-banner" role="alert" aria-live="polite" style="display: none;">
            <div class="notify-msg"></div>
            <button class="notify-close" aria-label="Dismiss"><i class="bi bi-x-lg"></i></button>
        </div>        
    </div>

    <!-- mobile UI (SwiperJS) -->
    <div id="mobile-ui" class="mobile-ui" style="visibility:hidden;opacity:0;pointer-events:none;">
        <div class="top-controls mb-3">
            <div class="swiper-button-prev"></div>
            <div class="swiper-pagination pt-4"></div>
            <div class="swiper-button-next"></div>
        </div>
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="swiper-wrapper">
                <!-- slides will be dynamically added here -->
            </div>
            <div class="swiper-scrollbar"></div>
        </div>
    </div>

    <!-- dynamic sidebar -->
    <div id="dynamicSidebar" class="sidebar">
        <!-- icon-only menu -->
        <div id="icon-menu" class="icon-menu">

            <span class="brand-link" data-face="front" title="3D Cube UI">
                <i class="bi bi-box fs-2" style="color: var(--accent)"></i>
            </span>

            <div class="flex-column justify-content-center align-items-center flex-shrink-0 bg-body-tertiary mt-3 h-100"> 
                <ul class="nav nav-pills nav-flush flex-column mb-auto text-center"> 
                    <li class="nav-item"> 
                        <a href="#" class="nav-link active py-3 border-bottom rounded-0" data-face="front">
                            <i class="bi bi-1-circle fs-5"></i>
                        </a> 
                    </li> 
                    <li> 
                        <a href="#" class="nav-link py-3 border-bottom rounded-0" data-face="right"> 
                            <i class="bi bi-2-circle fs-5"></i>
                        </a> 
                    </li> 
                    <li> 
                        <a href="#" class="nav-link py-3 border-bottom rounded-0" data-face="back"> 
                            <i class="bi bi-3-circle fs-5"></i>
                        </a> 
                    </li> 
                    <li> 
                        <a href="#" class="nav-link py-3 border-bottom rounded-0" data-face="left"> 
                            <i class="bi bi-4-circle fs-5"></i>
                        </a> 
                    </li> 
                    <li> 
                        <a href="#" class="nav-link py-3 border-bottom rounded-0" data-face="top"> 
                            <i class="bi bi-5-circle fs-5"></i>
                        </a> 
                    </li> 
                    <li> 
                        <a href="#" class="nav-link py-3 border-bottom rounded-0" data-face="bottom"> 
                            <i class="bi bi-6-circle fs-5"></i>
                        </a> 
                    </li> 
                </ul> 
            </div> 
        </div>
        <!-- large button menu -->
        <div id="button-menu" class="button-menu">

            <!-- logo -->
            <div class="menu-logo electrolize d-flex flex-row justify-content-center align-items-center gap-2 mb-4" aria-label="3D Cube UI">
                <div class="logo-text">3D</div>
                <div>
                    <svg width="32" height="32" viewBox="0 0 512 512" role="img" aria-hidden="true">
                    <polygon fill="currentColor" fill-opacity="0" points="240.988,12.877 13.76,107.164 13.76,412.378 256.008,499.259 498.264,412.378 498.264,107.164 " />
                    <g fill="currentColor">
                        <path d="M256.008,512L1.764,420.824V99.15L240.708,0l269.528,98.782v322.042L256.008,512z M25.757,403.933 l230.251,82.586l230.251-82.586V115.545L241.252,25.729l-215.495,89.44V403.933z" />
                        <polygon points="256.008,211.936 9.705,123.599 17.815,101.005 256.008,186.438 494.209,101.005 502.319,123.599" />
                        <rect x="244.011" y="199.187" width="23.994" height="300.08" />
                    </g>
                    </svg>
                </div>
                <div class="logo-text">Cube</div>
            </div>

            <!-- buttons -->
            <div id="btns2" class="d-flex flex-column flex-nowrap justify-content-center align-items-center py-2">
                <button class="btn mb-2 sb-btns" data-face="front"><span class="btn-label"></span><span class="visually-hidden">Face 1</span></button>
                <button class="btn mb-2 sb-btns" data-face="right"><span class="btn-label"></span><span class="visually-hidden">Face 2</span></button>
                <button class="btn mb-2 sb-btns" data-face="back"><span class="btn-label"></span><span class="visually-hidden">Face 3</span></button>
                <button class="btn mb-2 sb-btns" data-face="left"><span class="btn-label"></span><span class="visually-hidden">Face 4</span></button>
                <button class="btn mb-2 sb-btns" data-face="top"><span class="btn-label"></span><span class="visually-hidden">Face 5</span></button>
                <button class="btn mb-2 sb-btns" data-face="bottom"><span class="btn-label"></span><span class="visually-hidden">Face 6</span></button>
            </div>
        </div>
    </div>

    <!-- 3d cube application -->
    <div id="app" class="app">

        <!-- spacer column: a placeholder which provides space for sidebar menu -->
        <div id="scolumn" class="scolumn d-flex justify-content-end">

            <!-- floating buttons (only appears on large screens) -->
            <div class="floating-buttons">
                <div id="btns1" class="d-flex flex-column flex-nowrap justify-content-center align-items-center">
                    <button class="btn fbtns mb-2" data-face="front"><span class="btn-label"></span><span class="visually-hidden">Face 1</span></button>
                    <button class="btn fbtns mb-2" data-face="right"><span class="btn-label"></span><span class="visually-hidden">Face 2</span></button>
                    <button class="btn fbtns mb-2" data-face="back"><span class="btn-label"></span><span class="visually-hidden">Face 3</span></button>
                    <button class="btn fbtns mb-2" data-face="left"><span class="btn-label"></span><span class="visually-hidden">Face 4</span></button>
                    <button class="btn fbtns mb-2" data-face="top"><span class="btn-label"></span><span class="visually-hidden">Face 5</span></button>
                    <button class="btn fbtns mb-2" data-face="bottom"><span class="btn-label"></span><span class="visually-hidden">Face 6</span></button>
                </div>
            </div>
            
        </div>

        <!-- cube column -->
        <main id="ccolumn" class="d-flex flex-grow-1 justify-content-center align-items-center">
            
            <div class="scene" id="scene">
                <div class="cube" id="cube">
                
                    <!-- Face 1 -->
                    <div class="face face-front" data-face="front" role="region" aria-label="Face 1">
                        <div class="face-border"></div>
                        <div class="face-content" id="face-front-content"></div>
                    </div>

                    <!-- Face 2 -->
                    <div class="face face-right" data-face="right" role="region" aria-label="Face 2">
                        <div class="face-border"></div>
                        <div class="face-content" id="face-right-content"></div>
                    </div>

                    <!-- Face 3 -->
                    <div class="face face-back" data-face="back" role="region" aria-label="Face 3">
                        <div class="face-border"></div>
                        <div class="face-content" id="face-back-content"></div>
                    </div>

                    <!-- Face 4 -->
                    <div class="face face-left" data-face="left" role="region" aria-label="Face 4">
                        <div class="face-border"></div>
                        <div class="face-content" id="face-left-content"></div>
                    </div>

                    <!-- Face 5 -->
                    <div class="face face-top" data-face="top" role="region" aria-label="Face 5">
                        <div class="face-border"></div>
                        <div class="face-content" id="face-top-content"></div>
                    </div>

                    <!-- Face 6 -->
                    <div class="face face-bottom" data-face="bottom" role="region" aria-label="Face 6">
                        <div class="face-border"></div>
                        <div class="face-content" id="face-bottom-content"></div>
                    </div>

                </div>            
            </div>

        </main>

    </div>

    <!-- Bootstrap 5.3.8 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- SwiperJS 12 -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <!-- Local Javascript (?v= cache-buster: bump on each deploy so browsers
         fetch fresh JS instead of a stale cached copy — app.js has no
         Cache-Control header, so Chromium caches it heuristically otherwise) -->
    <script src="assets/js/notifications.js?v=20260720c"></script>
    <script src="assets/js/urlManager.js?v=20260720c"></script>
    <script src="assets/js/app.js?v=20260720c"></script>

    <!-- DEV USE: show screen size dimensions -->
    <!-- <script src="https://cdn.jsdelivr.net/gh/kendawson-online/sss@v1.1.0/sss.js"></script> -->

</body>
</html>
