<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Loading</title>
        <style>
            :root {
            --loader-size: 50px;
            --loader-color: #e74c3c;
            --loader-speed: 3s;
            --perspective: 1000px;
            }

            body {
                background-color: #000000;
                color: #ffffff;
                font-size: 18px;
            }
            
            .wrapper {
                min-height: 85vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 20px;
            }

            /* Loading text */
            
            .loading {
                color: var(--loader-color);
                display: inline-block;
                position: relative;
                font-size: 3.5rem;
                font-family: Arial, Helvetica, sans-serif;
                box-sizing: border-box;
                margin-bottom: 2%;
            }
            .loading::after {
                content: '';  
                width: 5px;
                height: 5px;
                background: currentColor;
                position: absolute;
                bottom: 10px;
                right: -5px;
                box-sizing: border-box;
                animation: animloader 1s linear infinite;
            }

            /* Spinning cube */

            .loader-cube {
                position: relative;
                width: var(--loader-size);
                height: var(--loader-size);
                transform-style: preserve-3d;
                animation: rotateCube var(--loader-speed) infinite linear;
                perspective: var(--perspective);
                transform: rotateX(45deg) rotateY(45deg);
            }

            .loader-cube .face {
                position: absolute;
                width: var(--loader-size);
                height: var(--loader-size);
                background-color: var(--loader-color);
                opacity: 0.8;
                border: 1px solid #fff;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .loader-cube .front  { transform: rotateY(0deg) translateZ(calc(var(--loader-size) / 2)); }
            .loader-cube .back   { transform: rotateY(180deg) translateZ(calc(var(--loader-size) / 2)); }
            .loader-cube .left   { transform: rotateY(-90deg) translateZ(calc(var(--loader-size) / 2)); }
            .loader-cube .right  { transform: rotateY(90deg) translateZ(calc(var(--loader-size) / 2)); }
            .loader-cube .top    { transform: rotateX(90deg) translateZ(calc(var(--loader-size) / 2)); }
            .loader-cube .bottom { transform: rotateX(-90deg) translateZ(calc(var(--loader-size) / 2)); }


            /* animations */

            @keyframes animloader {
                0% {
                    box-shadow: 10px 0 rgba(255, 255, 255, 0), 20px 0 rgba(255, 255, 255, 0);
                }
                50% {
                    box-shadow: 10px 0 var(--loader-color), 20px 0 rgba(255, 255, 255, 0);
                }
                100% {
                    box-shadow: 10px 0 var(--loader-color), 20px 0 var(--loader-color);
                }
            }

            @keyframes rotateCube {
                0% {
                    transform: rotateX(0deg) rotateY(0deg);
                }
                100% {
                    transform: rotateX(360deg) rotateY(360deg);
                }
            }   

        </style>
    </head>
    <body>
    
    <!-- Loading spinner -->
    <div class="wrapper">
        <div class="loading">Loading</div>
        <div class="loader-cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face left"></div>
            <div class="face right"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>        
    </div>

    </body>
</html>
